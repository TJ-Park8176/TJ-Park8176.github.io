<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공덕왕 (King of Karma) - 공식 안내 및 정책 센터</title>
  <style>
    :root {
      --bg: #0B0D13;
      --card: #171B26;
      --jade: #2EF2A0;
      --gold: #FFD666;
      --text: #F4F6FA;
      --muted: #949EB0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
      line-height: 1.6;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 32px 28px;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(46, 242, 160, 0.14);
      color: var(--jade);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 26px;
      font-weight: 800;
    }
    p { color: var(--muted); margin: 0 0 24px 0; font-size: 15px; }
    .btn-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.btn {
      display: block;
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 15px;
      background: #1E2330;
      color: var(--text);
      transition: transform 0.15s ease;
    }
    a.btn:hover { transform: translateY(-2px); }
    a.btn-jade {
      background: rgba(46, 242, 160, 0.15);
      color: var(--jade);
    }
    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <span class="badge">Taejoon Labs Official</span>
      <h1>공덕왕 (King of Karma)</h1>
      <p>사주 길방 로또 명당 레이더 · 4단계 카르마 번호 추출 · 복권 QR 공덕 스캐너</p>
      <div class="btn-list">
        <a class="btn btn-jade" href="./privacy-policy.html">개인정보처리방침 (Privacy Policy) 바로가기 →</a>
        <a class="btn" href="./delete-account.html">클라우드 계정 및 백업 데이터 영구 삭제 센터 →</a>
      </div>
    </div>
    <div class="footer">
      © 2026 Taejoon Labs (Origincs). 문의: ptj8176@gmail.com
    </div>
  </div>
</body>
</html>
